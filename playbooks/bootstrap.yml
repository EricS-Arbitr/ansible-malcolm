- name: Bootstrap automation access
  hosts: malcolm
  become: true
  vars:
    automation_user: ansible
    automation_pubkeys: 
      - "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBdWfzSBGm4NQGKiIbpMm3Vjv0mUPab/i7ieKQuL5EIM eric@Eric-Gaming-Rig"
  tasks:
    - name: Create automation user
      ansible.builtin.user:
        name: "{{ automation_user }}"
        shell: /bin/bash
        groups: sudo
        append: true

    - name: Authorize SSH keys
      ansible.posix.authorized_key:
        user: "{{ automation_user }}"
        key: "{{ automation_pubkeys | join('\n') }}"
        exclusive: true

    - name: Passwordless sudo for automation user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ automation_user }}"
        content: "{{ automation_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
