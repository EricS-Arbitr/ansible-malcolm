- name: Check whether the Malcolm service is already active
  ansible.builtin.systemd_service:
    name: malcolm
  register: malcolm_service_state
  failed_when: false

- name: Install Malcolm systemd unit
  ansible.builtin.template:
    src: malcolm.service.j2
    dest: /etc/systemd/system/malcolm.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Malcolm

- name: Enable and start Malcolm
  ansible.builtin.systemd_service:
    name: malcolm
    enabled: true
    state: started
    daemon_reload: true

# The handler restarts only a stack that was already running before this run;
# a stack started just now already has the current config.
- name: Record whether Malcolm was running before this run
  ansible.builtin.set_fact:
    malcolm_was_active: "{{ (malcolm_service_state.status | default({})).get('ActiveState', '') == 'active' }}"

- name: Apply pending config changes before health check
  ansible.builtin.meta: flush_handlers

- name: Wait for Malcolm API
  ansible.builtin.uri:
    url: https://localhost/mapi/ping
    url_username: "{{ malcolm_admin_username }}"
    url_password: "{{ malcolm_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: malcolm_ping
  until: malcolm_ping.status == 200 and 'pong' in (malcolm_ping.content | default(''))
  retries: "{{ (malcolm_ready_timeout | int / 15) | int }}"
  delay: 15
  # Plain HTTP check; no sudo, so a loaded host doesn't hit become timeouts.
  become: false
  no_log: "{{ malcolm_no_log }}"
