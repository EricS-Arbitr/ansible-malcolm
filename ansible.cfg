[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# Run notified handlers even if a later task fails, so config changes are
# never left written-but-not-applied.
force_handlers = True
vault_password_file = ~/.ansible/vault_pass.txt
# Malcolm's first start pins the target's CPUs; allow slow SSH/sudo responses.
timeout = 30

[ssh_connection]
pipelining = True
