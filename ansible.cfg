[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# Run notified handlers even if a later task fails, so config changes are
# never left written-but-not-applied.
force_handlers = True
# vault_password_file = ~/.ansible/vault_pass.txt   # enable once you create it

[ssh_connection]
pipelining = True
